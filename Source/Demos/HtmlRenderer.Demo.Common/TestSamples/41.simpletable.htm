<html>
<head>
    <title>Simple Table</title>
    <style>

        .nested {
            display: inline-block;
        }
    </style>
</head>
<body>

    <span style="background-color: red;">Span 1</span>
    <span>Span 2</span>
    <p>And then some divs with inline-block style</p>
    <div>
        <div class="nested" style="background-color: blue; width: 300px;">
            <h2>Here's a heading</h2>
        </div>
        <div class="nested" style="background-color: red; width: 200px;">Div 2</div>
    </div>
</body>
</html>
